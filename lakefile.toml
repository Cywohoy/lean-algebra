name = "korean-algebra"
defaultTargets = ["AlgebraBook", "textbook"]

[[require]]
name = "ample"
git = "https://github.com/Cywohoy/ample"
rev = "8e1f77983e4ba2d02bd59c666539e1a2b0ea731c"

[[require]]
name = "MD4Lean"
path = "vendor/MD4Lean"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.35.0"

[[lean_lib]]
name = "AlgebraBook"
globs = ["AlgebraBook.*"]

[[lean_exe]]
name = "textbook"
root = "Main"
