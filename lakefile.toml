name = "korean-algebra"
defaultTargets = ["AlgebraBook", "textbook"]

[[require]]
name = "ample"
git = "https://github.com/Cywohoy/ample"
rev = "2ca593e44cbaa9915461ade6ceb9901bfd856bcc"

[[require]]
name = "MD4Lean"
path = "vendor/MD4Lean"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.35.0"

[[lean_lib]]
name = "AlgebraBook"
globs = ["AlgebraBook.*"]

[[lean_exe]]
name = "textbook"
root = "Main"
