name: Book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: false
      - name: Generate the standalone book
        run: lake exe textbook
      - name: Check examples, exercises, and tactic regressions
        run: python tests/verify_revision.py
      - name: Check document boundaries and links
        run: python tests/RevisionDocument.Tests.py
      - name: Check exported mathematics
        run: python scripts/sync_ample.py --ample-root .lake/packages/ample --check
      - name: Check automation traces and library documentation
        run: |
          python tests/AutomationTrace.Tests.py
          python tests/LibraryDocumentation.Tests.py
      - name: Check browser frontend proof states with native Lean
        run: |
          lake build Ample
          python experiments/wasm/Frontend.Tests.py
      - uses: actions/cache@v4
        with:
          path: tmp/wasm/downloads
          key: lean-wasm-${{ hashFiles('web/wasm-runtime.json') }}
      - name: Prepare the static site
        run: |
          python scripts/prepare_pages.py
          python tests/Pages.Tests.py
          python tests/Preview.Tests.py
          python scripts/build_unicode_input.py --check
          node tests/UnicodeTable.Tests.cjs
          node tests/ExerciseModel.Tests.cjs
      # The Pages artifact already contains the complete downloadable site.
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _out/pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the book
        id: deployment
        uses: actions/deploy-pages@v4
